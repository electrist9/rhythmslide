[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rhythmslide"
version = "0.1.0"
description = "音楽のリズムに同期したスライドショーをリアルタイム表示する Windows デスクトップアプリ"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RhythmSlide" }]
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "Pillow>=10.0",
    "mutagen>=1.47",
    "soundfile>=0.12",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.gui-scripts]
rhythmslide = "rhythmslide.app:main"

[tool.setuptools.packages.find]
include = ["rhythmslide*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
